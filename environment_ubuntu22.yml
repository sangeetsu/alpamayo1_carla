# Portable Conda environment for Ubuntu 22 with Alpamayo + CARLA bridge support.
# Create from the repo root with:
#   conda env create -f environment_ubuntu22.yml
# or update an existing env with:
#   conda env update -n alpamayo_carla -f environment_ubuntu22.yml --prune
#
# Notes:
# - This intentionally avoids machine-specific local paths and build hashes.
# - It expects an NVIDIA driver to already be installed on the host.
# - `-e .` installs the current checkout of this repo into the environment.

name: alpamayo_carla
channels:
  - nvidia
  - defaults
dependencies:
  - python=3.12
  - pip
  - packaging=25.0
  - ninja=1.13.1
  - cuda-toolkit=12.8
  - gcc_linux-64=14.3.0
  - gxx_linux-64=14.3.0
