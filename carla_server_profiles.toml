active_profile = "local_package"

[profiles.local_package]
description = "Launch or connect to the local CARLA 0.9.16 package install on this workstation."
host = "127.0.0.1"
port = 2000
tm_port = 8010
connect_timeout_seconds = 10.0
startup_timeout_seconds = 60.0
launch_if_unreachable = true
terminate_on_exit = false
working_directory = "/home/sangeetsu/CARLA/CARLA_0.9.16"
launch_command = ["./CarlaUE4.sh", "-RenderOffScreen", "-nosound", "-carla-rpc-port=2000"]

[profiles.lab_docker]
description = "Example remote Docker profile. Set host/ports to your lab server and leave launch_if_unreachable=false unless you intentionally want this script to start the remote container."
host = "lab-server.example.com"
port = 2000
tm_port = 8000
connect_timeout_seconds = 10.0
startup_timeout_seconds = 90.0
launch_if_unreachable = false
terminate_on_exit = false
# Example if you really want the bridge script to trigger remote startup:
# launch_if_unreachable = true
# launch_command = ["ssh", "you@lab-server.example.com", "docker", "start", "carla-0.9.16"]
