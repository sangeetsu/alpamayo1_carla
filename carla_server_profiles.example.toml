active_profile = "local_package"

[profiles.local_package]
description = "Local CARLA package profile. Copy this file to carla_server_profiles.toml and update the package path for this machine."
host = "127.0.0.1"
port = 2000
tm_port = 8010
connect_timeout_seconds = 10.0
startup_timeout_seconds = 60.0
launch_if_unreachable = true
terminate_on_exit = false
working_directory = "/absolute/path/to/CARLA_0.9.16"
launch_command = ["./CarlaUE4.sh", "-RenderOffScreen", "-nosound", "-carla-rpc-port=2000"]

[profiles.lab_docker]
description = "Remote CARLA Docker profile. Replace the placeholder host and keep launch_if_unreachable=false unless non-interactive SSH startup is configured."
host = "lab-server.example.com"
port = 2000
tm_port = 8010
connect_timeout_seconds = 10.0
startup_timeout_seconds = 90.0
launch_if_unreachable = false
terminate_on_exit = false
# Optional SSH-based remote start example:
# launch_if_unreachable = true
# launch_command = [
#   "ssh",
#   "your_user@your_lab_server",
#   "cd ~/carla-0.9.16-docker && docker compose up -d",
# ]
